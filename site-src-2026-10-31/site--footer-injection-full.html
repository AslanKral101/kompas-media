<style>

<script>
(function(){
  /* English path : Turkish path. Add a line here whenever a Turkish copy of a page is published. */
  var PAIRS={"/":"/turkce","/technical":"/teknik","/where-to-buy":"/nereden-alinir"};
  var TR_HOME="/turkce",EN_HOME="/";
  function pill(extra){
    var p=location.pathname.replace(/\/$/,'')||'/',trOf=PAIRS[p],enOf=null,k;
    for(k in PAIRS){if(PAIRS[k]===p)enOf=k}
    var isTR=!!enOf,w=document.createElement('div');
    w.className='k-lang'+(extra?' '+extra:'');w.setAttribute('role','navigation');w.setAttribute('aria-label','Language');
    w.innerHTML='<a href="'+(isTR?enOf:location.pathname)+'" lang="en" hreflang="en"'+(isTR?'':' class="is-on" aria-current="true"')+'>EN</a>'+
                '<a href="'+(isTR?location.pathname:(trOf||TR_HOME))+'" lang="tr" hreflang="tr"'+(isTR?' class="is-on" aria-current="true"':'')+'>TR</a>';
    return w;
  }
  function run(){
    if(!document.querySelector('.k-lang')){
      var hosts=document.querySelectorAll('.header-actions--right');
      for(var i=0;i<hosts.length;i++){hosts[i].insertBefore(pill(),hosts[i].firstChild)}
    }
    var vis=false,all=document.querySelectorAll('.k-lang:not(.k-lang-fixed)');
    for(var j=0;j<all.length;j++){if(all[j].offsetWidth>0)vis=true}
    var fx=document.querySelector('.k-lang-fixed');
    if(!vis&&!fx){document.body.appendChild(pill('k-lang-fixed'))}
    if(vis&&fx){fx.parentNode.removeChild(fx)}
    var kf=document.querySelector('.kf');
    if(kf&&!kf.querySelector('a[href="/technical"]')){
      var links=kf.querySelectorAll('a');
      for(var n=0;n<links.length;n++){
        var h=links[n].getAttribute('href')||'',node=links[n].closest('li')||links[n];
        if(/\/history$/.test(h)){var c=node.cloneNode(true),a=c.tagName==='A'?c:c.querySelector('a');a.setAttribute('href','/technical');a.textContent='Technical Guide';node.parentNode.insertBefore(c,node.nextSibling)}
        if(/\/faq$/.test(h)){var c2=node.cloneNode(true),a2=c2.tagName==='A'?c2:c2.querySelector('a');a2.setAttribute('href','/where-to-buy');a2.textContent='Where to Buy';node.parentNode.insertBefore(c2,node)}
      }
    }
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',run)}else{run()}
  window.addEventListener('resize',run);
})();
</script>

(function(){

<script>
(function(){
  var mob=function(){return window.matchMedia('(max-width:767px)').matches;};
  function ready(fn){if(document.readyState!=='loading')fn();else document.addEventListener('DOMContentLoaded',fn);}
  function inView(el,cb){if(!('IntersectionObserver' in window)||!el)return;new IntersectionObserver(function(es){cb(es[0].isIntersecting);}).observe(el);}
  var path=location.pathname.replace(/\/+$/,'')||'/';
  ready(function(){
    var foot=document.querySelector('footer, #footer-sections');

    /* Home: desktop CTA on the hero (first screen had no way to the shop) */
    if(path==='/'){
      var hero=document.querySelector('section.page-section');
      if(hero&&!hero.querySelector('.k-hero-cta')){
        var a=document.createElement('a');a.className='k-hero-cta';a.href='/watches';a.textContent='Shop the watches →';
        if(getComputedStyle(hero).position==='static')hero.style.position='relative';
        hero.appendChild(a);
      }
    }

    /* Product pages */
    var native=document.querySelector('.product-content-wrapper .sqs-add-to-cart-button');
    var title=document.querySelector('.product-content-wrapper .product-title');
    var notify=document.querySelector('.k-notify');
    var soldOut=native&&(native.classList.contains('sold-out')||/sold out/i.test(native.textContent)||native.getAttribute('aria-disabled')==='true');
    if(notify){
      /* in-stock alternatives inside the sold-out box */
      fetch('/watches?format=json',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
        var here=path.split('/').pop();
        var ok=(d.items||[]).filter(function(it){
          var v=(it.structuredContent&&it.structuredContent.variants)||[];
          return (it.urlId||'').toLowerCase()!==here&&v.some(function(x){return x.unlimited||x.qtyInStock>0;});
        });
        if(!ok.length)return;
        var p=document.createElement('p');p.className='k-instock';p.appendChild(document.createTextNode('In stock now: '));
        ok.forEach(function(it){var l=document.createElement('a');l.href='/watches/p/'+it.urlId;l.textContent=it.title+' →';p.appendChild(l);});
        notify.appendChild(p);
      }).catch(function(){});
    }
    if(native&&title&&soldOut&&notify&&!document.querySelector('.k-buybar')){
      /* phones: sticky waitlist bar on sold-out models */
      var bar=document.createElement('div');bar.className='k-buybar';
      bar.innerHTML='<span class="k-buybar-txt"><span class="k-buybar-name"></span><span class="k-buybar-sold">Sold out for now</span></span><a class="k-buybar-btn" href="/waitlist" style="display:inline-flex;align-items:center;text-decoration:none">Join the waitlist</a>';
      bar.querySelector('.k-buybar-name').textContent='KOMPAS '+title.textContent.trim();
      document.body.appendChild(bar);
      var nVis=false,fVis=false;
      function upd(){bar.classList.toggle('is-on',mob()&&!nVis&&!fVis);document.body.classList.toggle('k-has-buybar',mob());}
      inView(notify,function(v){nVis=v;upd();});inView(foot,function(v){fVis=v;upd();});
      window.addEventListener('resize',upd);upd();
    }

    /* Content pages: a quiet way back to the shop once the reader is into the page */
    var content=path==='/history'||path==='/technical'||/^\/journal\/.+/.test(path);
    if(content){
      var pill=document.createElement('a');pill.className='k-pill';pill.href='/watches';pill.textContent='Shop the watches →';
      document.body.appendChild(pill);
      var endVis=false,footVis=false;
      var ends=[].slice.call(document.querySelectorAll('a[href^="/watches/p/"]'));
      var last=ends.length?ends[ends.length-1]:null;
      function pupd(){var h=document.documentElement.scrollHeight-innerHeight;var deep=h>0&&scrollY/h>0.25;pill.classList.toggle('is-on',deep&&!endVis&&!footVis);}
      inView(last,function(v){endVis=v;pupd();});inView(foot,function(v){footVis=v;pupd();});
      window.addEventListener('scroll',pupd,{passive:true});pupd();
    }

    /* Cart: reassurance next to the checkout button (8 of 9 carts left before entering an email) */
    if(path==='/cart'){
      var tries=0;(function addTrust(){
        var btn=[].slice.call(document.querySelectorAll('button,a')).filter(function(b){return /^\s*checkout\s*$/i.test(b.textContent);})[0];
        if(!btn){if(tries++<20)setTimeout(addTrust,300);return;}
        if(document.querySelector('.k-cart-trust'))return;
        var t=document.createElement('div');t.className='k-cart-trust';
        t.innerHTML='<b>Free tracked shipping</b> to 40+ countries · <b>14-day returns</b> · <b>2-year warranty</b><br>Secure checkout, with 3 interest-free payments by Klarna. UK prices include VAT; outside the UK, local import duties may apply. Questions? <a href="mailto:contact@kompaswatches.com" style="color:#FF9800">contact@kompaswatches.com</a>';
        var host=btn.closest('div')||btn.parentElement;host.parentElement.insertBefore(t,host.nextSibling);
      })();
    }
  });
})();
</script>

<script id="k-nav-js">
(function(){
  if(window.__kNav)return;window.__kNav=1;
  var DESC={'/adventure':'The field watch, out there','/journal':'Stories and field guides','/radio-player':'Sets to take with you',
    '/news':'Press and updates','/faq':'Shipping, returns, warranty','/where-to-buy':'Stockists and shipping'};
  var MODEL={north:'Black',south:'Blue',east:'Green',west:'Red'};
  function path(a){try{return new URL(a.href,location.href).pathname.replace(/\/$/,'')||'/'}catch(e){return ''}}
  function label(a){var s=a.querySelector('.header-nav-folder-item-content');return (s||a).textContent.trim()}
  function enhance(a,mobile){
    if(a.__kn)return;var p=path(a),m=p.match(/^\/watches\/p\/(north|south|east|west)$/),name=label(a);
    if(p==='/watches'&&!mobile){a.__kn=1;a.parentNode.classList.add('k-nv-all');
      a.innerHTML='<span>£535 · free shipping · 2-year warranty</span><span class="k-nv-go">All watches →</span>';return}
    var sub=m?MODEL[m[1]]:DESC[p];if(!sub)return;a.__kn=1;
    var tgt=mobile?(a.querySelector('.header-menu-nav-item-content')||a):a;tgt.classList.add('k-nv-row');
    tgt.innerHTML=(m?'<span class="k-nv-d" data-k="'+m[1]+'" aria-hidden="true"></span>':'')+'<span class="k-nv-t"><b>'+name+'</b><small'+(m?' data-s="'+m[1]+'"':'')+'>'+sub+'</small></span>';
  }
  function run(){
    [].forEach.call(document.querySelectorAll('#header .header-nav-folder-item a'),function(a){enhance(a,false)});
    [].forEach.call(document.querySelectorAll('.header-menu .header-menu-nav-folder:not([data-folder="root"]) .header-menu-nav-item a'),function(a){enhance(a,true)});
  }
  var data=null;
  function live(){
    if(data)return;data=1;
    fetch('/watches?format=json',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(j){
      (j.items||[]).forEach(function(it){var k=(it.urlId||'').toLowerCase();if(!MODEL[k])return;
        var v=it.variants||[],out=v.length&&v.every(function(x){return !x.unlimited&&x.qtyInStock<=0});
        var img=it.assetUrl?it.assetUrl+'?format=300w':'';
        [].forEach.call(document.querySelectorAll('.k-nv-d[data-k="'+k+'"]'),function(d){if(img)d.style.backgroundImage='url("'+img+'")'});
        [].forEach.call(document.querySelectorAll('small[data-s="'+k+'"]'),function(s){s.textContent=MODEL[k]+' · '+(out?'Restock list':'Ready to ship')})});
    }).catch(function(){data=null});
  }
  run();
  var hdr=document.getElementById('header');
  if(hdr){['pointerover','focusin','touchstart'].forEach(function(ev){hdr.addEventListener(ev,function(){run();live()},{passive:true})})}
  (window.requestIdleCallback||function(f){setTimeout(f,2500)})(function(){run();live()});
})();
</script>
