<style>

  /* ---- endless row ---- */
  .kqt-viewport {

    mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
  }

  .kqt-track {
    display: flex;
    width: max-content;
    animation: kqtScroll 60s linear infinite;
  }

  .kqt-viewport:hover .kqt-track {
    animation-play-state: paused;
  }

  .kqt-set {
    display: flex;

  }

  @keyframes kqtScroll {
    from { transform: translateX(0); }

  }

  /* ---- quote card ---- */
  .kqt-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 360px;
    min-height: 220px;
    margin: 0;
    padding: 28px 28px 24px;
    text-align: left;
    background: rgba(0, 0, 0, 0.45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid var(--kx-line);
    border-radius: 8px;
    box-sizing: border-box;
    transition: border-color 0.3s ease, transform 0.3s ease;
  }

  .kqt-card:hover {
    border-color: var(--kx-orange);
    transform: translateY(-4px);
  }

  .kqt-card blockquote {
    position: relative;
    margin: 0 0 24px !important;
    padding: 0 !important;
    border: 0 !important;
    font-size: 17px !important;
    font-weight: 500 !important;
    font-style: normal !important;
    line-height: 1.5 !important;
    color: var(--kx-white) !important;
  }

  .kqt-card blockquote::before {
    content: "\201C";
    display: block;
    margin-bottom: 6px;
    font-size: 48px;
    font-weight: 700;
    line-height: 0.8;
    color: var(--kx-orange);
  }

  .kqt-card figcaption {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--kx-line);
  }

  .kqt-name {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--kx-orange);
  }

  .kqt-type {
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--kx-muted);
  }

  @media (max-width: 640px) {
    .kqt-card {
      width: 280px;
      min-height: 200px;
      padding: 22px 22px 20px;
    }
    .kqt-card blockquote {
      font-size: 16px !important;
    }
  }

  /* no motion: plain swipeable row instead */
  @media (prefers-reduced-motion: reduce) {
    .kqt-viewport {
      overflow-x: auto;
      -webkit-mask-image: none;
      mask-image: none;
    }
    .kqt-track {
      animation: none;
    }
    .kqt-set[aria-hidden="true"] {
      display: none;
    }
    .kqt-card {
      transition: none;
    }
  }
</style>
