    if (root.classList.contains('is-hover')) dot.style.transform = 'translate3d(' + ptr.x.toFixed(1) + 'px,' + ptr.y.toFixed(1) + 'px,0)';
  }
  function busy() {

  // ---------- keyboard: roving focus across the prints ----------
  function setCur(fi) {

  root.addEventListener('keydown', function (e) {
    if ((e.key === 'Escape' || e.key === 'Esc') && cardOpen) { e.preventDefault(); closeCard(true); }
  });

  // ---------- screen-reader list ----------
  (function () {

  function onVis(v) {

  }

})();
