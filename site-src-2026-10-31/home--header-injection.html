.kqb-dark{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(closest-side,rgba(20,8,0,.55),rgba(20,8,0,.25) 60%,rgba(20,8,0,0));will-change:opacity,transform}

.kqb-fx,.kqb-gl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.kqb-gl{opacity:0;transition:opacity .5s cubic-bezier(.23,1,.32,1)}
.kqb.is-gl .kqb-gl{opacity:1}
.kqb-vig{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,#000 0%,rgba(0,0,0,0) 16%,rgba(0,0,0,0) 74%,#000 100%),linear-gradient(to right,#000 0%,rgba(0,0,0,0) 14%,rgba(0,0,0,0) 86%,#000 100%),radial-gradient(ellipse 70% 80% at 58% 50%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
