<script>
(function(){
  var root=document.getElementById('kompasIG2'); if(!root) return;
  var UTM='utm_source=instagram&utm_medium=social&utm_campaign=link_in_bio';
  function tag(a,content){
    var h=a.getAttribute('href'); if(!h||h.indexOf('http')===0&&h.indexOf(location.host)<0) return;
    var sep=h.indexOf('?')<0?'?':'&';
    a.setAttribute('href',h+sep+UTM+'&utm_content='+encodeURIComponent(content));
  }
  var siteLogo=document.querySelector('header img, .header-title-logo img');
  var logo=root.querySelector('[data-logo]');
  if(siteLogo&&logo){logo.src=siteLogo.currentSrc||siteLogo.src;}
  root.querySelectorAll('[data-optional]').forEach(function(a){
    fetch(a.getAttribute('href'),{method:'HEAD'}).then(function(r){if(!r.ok)a.remove();}).catch(function(){a.remove();});
  });
  fetch('/watches?format=json',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
    (d.items||[]).forEach(function(it){
      var slug=(it.urlId||'').toLowerCase();
      var card=root.querySelector('.kli-w[data-slug="'+slug+'"]'); if(!card) return;
      if(it.assetUrl) card.style.backgroundImage='url("'+it.assetUrl+'?format=750w")';
      var v=(it.structuredContent&&it.structuredContent.variants)||[];
      var soldOut=v.length&&v.every(function(x){return !x.unlimited&&x.qtyInStock<=0;});
      if(soldOut){var b=document.createElement('span');b.className='kli-badge';b.textContent='Sold out';card.appendChild(b);}
    });
  }).catch(function(){}).then(function(){
    root.querySelectorAll('.kli-w').forEach(function(a){tag(a,'watch_'+a.dataset.slug);});
    root.querySelectorAll('.kli-l').forEach(function(a){tag(a,a.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,40));});
  });
})();
</script>
